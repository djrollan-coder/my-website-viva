<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Разрез = контур иглы, расширенный наружу -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#ffffff"/>
      <path d="M 83 429 L 233 233 L 429 83 L 279 279 Z"
            fill="#000000" stroke="#000000" stroke-width="52"
            stroke-linejoin="miter" stroke-miterlimit="20"/>
    </mask>
  </defs>

  <!-- Кольцо с разрезами по форме иглы -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="#000000"
          stroke-width="58" mask="url(#gap)"/>

  <!-- Игла компаса -->
  <path d="M 83 429 L 233 233 L 429 83 L 279 279 Z" fill="#000000"/>

  <!-- Точка в центре -->
  <circle cx="256" cy="256" r="55" fill="#000000"/>
</svg>